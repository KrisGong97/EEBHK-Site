server {
    listen 8080;
    server_name _;
    root /var/www/EEBHK-Site;
    index index.html;

    # 开发迭代期：HTML 不缓存，确保改动即时生效
    location ~* \.html$ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    # 其他资源（css/js/图片）需重新验证，兼顾更新及时性与性能
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
